name: Hi3798MV100 内核自动构建

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/hisi.yml'
      - 'apply_hi3798mv100_v7.3_patches.sh'
      - 'kernel.config'
  workflow_dispatch:
    inputs:
      kernel_version:
        description: '内核版本标签'
        required: true
        default: 'v7.3-rc7'
      patches_commit:
        description: '补丁仓库 Commit（留空则用最新 master）'
        required: false
        default: 'master'
  release:
    types: [ published ]

# 创建 Release 必须要有写权限，只给 read 会 403
permissions:
  contents: write

jobs:
  build:
    name: 编译 Hi3798MV100 内核与模块
    runs-on: ubuntu-latest
    env:
      ARCH: arm
      CROSS_COMPILE: arm-linux-gnueabihf-
      KVER: "${{ github.event.inputs.kernel_version || 'v7.3-rc7' }}"
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 安装 ARM32 交叉编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
            bc bison flex libssl-dev libncurses5-dev ccache kmod u-boot-tools

      - name: 恢复 ccache 缓存
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: "${{ runner.os }}-ccache-${{ env.KVER }}-${{ github.sha }}"
          restore-keys: |
            ${{ runner.os }}-ccache-${{ env.KVER }}-
            ${{ runner.os }}-ccache-

      - name: 拉取 Linux 内核源码
        run: |
          git clone --branch "$KVER" https://github.com/torvalds/linux.git linux_build

      - name: 拉取 histb 补丁仓库
        run: |
          git clone https://github.com/histb-mainline/patches.git histb-hi3798-patches
          if [ -n "${{ github.event.inputs.patches_commit }}" ]; then
            git -C histb-hi3798-patches checkout "${{ github.event.inputs.patches_commit }}"
          fi

      - name: 部署打补丁脚本与内核配置
        run: |
          cp apply_hi3798mv100_v7.3_patches.sh linux_build/
          cp kernel.config linux_build/.config
          chmod +x linux_build/apply_hi3798mv100_v7.3_patches.sh

      - name: 批量应用 Hi3798MV100 补丁
        run: |
          cd linux_build
          ./apply_hi3798mv100_v7.3_patches.sh

      - name: 补全内核配置依赖
        run: |
          cd linux_build
          make olddefconfig

      - name: 编译内核、设备树与模块
        run: |
          cd linux_build
          export CCACHE_DIR="$HOME/.ccache"
          ccache --max-size=5G
          ccache -z
          make -j"$(nproc)" CROSS_COMPILE="ccache $CROSS_COMPILE" zImage
          make -j"$(nproc)" CROSS_COMPILE="ccache $CROSS_COMPILE" dtbs
          make -j"$(nproc)" CROSS_COMPILE="ccache $CROSS_COMPILE" modules
          ccache -s

      - name: 整理四类产物（各自独立，不合并）
        run: |
          cd linux_build
          rm -rf out
          mkdir -p out
          KREL="$(make -s kernelrelease)"

          # ① zImage 内核镜像
          cp arch/arm/boot/zImage out/

          # ② dtb 设备树
          cp arch/arm/boot/dts/hisilicon/*.dtb out/

          # ③ config 内核配置
          cp .config "out/config-${KREL}-hi3798mv100"

          # ④ modules.tar.gz 内核模块
          make INSTALL_MOD_PATH="$PWD/out/_mod" modules_install
          rm -f out/_mod/lib/modules/*/build out/_mod/lib/modules/*/source
          tar -czf out/modules.tar.gz -C out/_mod .
          rm -rf out/_mod

          ls -lh out/

      - name: 生成发布说明
        run: |
          cat > linux_build/release_notes.md <<EOF
          ## 海思 Hi3798MV100 内核构建

          | 项目 | 内容 |
          | --- | --- |
          | 芯片平台 | Hi3798MV100（ARMv7） |
          | 内核版本 | ${KVER} |
          | 补丁来源 | histb-mainline/patches |
          | 补丁提交 | ${{ github.event.inputs.patches_commit || 'main（最新）' }} |
          | 构建时间 | $(date -u +%Y-%m-%dT%H:%M:%SZ) |
          | 交叉工具链 | arm-linux-gnueabihf- |

          ### 产物清单
          - \`zImage\`：内核镜像
          - \`*.dtb\`：设备树
          - \`config-*\`：本次内核配置
          - \`modules.tar.gz\`：内核模块

          ### 刷机提示
          1. 刷写前务必备份原机固件与分区表
          2. zImage 与 dtb 按分区写入
          3. modules.tar.gz 解压后整体放到板端 /lib/modules/
          EOF

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: hi3798mv100-linux-7.3
          if-no-files-found: error
          retention-days: 90
          path: |
            linux_build/out/zImage
            linux_build/out/*.dtb
            linux_build/out/config-*
            linux_build/out/modules.tar.gz

      - name: 发布到 GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          body_path: linux_build/release_notes.md
          generate_release_notes: true
          files: |
            linux_build/out/zImage
            linux_build/out/*.dtb
            linux_build/out/config-*
            linux_build/out/modules.tar.gz
