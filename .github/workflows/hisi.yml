name: Hi3798MV100 内核自动构建

on:
  push:
    branches: [ master, main ]
    paths:
      - '.github/workflows/hisi.yml'
      - 'apply_hi3798mv100_v7.4_patches.sh'
      - 'kernel.config'
  workflow_dispatch:
    inputs:
      kernel_version:
        description: '内核版本标签'
        required: true
        default: 'v7.4-rc1'
      patches_commit:
        description: '补丁仓库Commit哈希（留空则用最新master分支）'
        required: false
        default: ''
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-hi3798mv100:
    name: 编译 Hi3798MV100 内核+模块
    runs-on: ubuntu-latest
    env:
      ARCH: arm
      CROSS_COMPILE: arm-linux-gnueabihf-
      KVER: "${{ github.event.inputs.kernel_version || 'v7.4-rc1' }}"
    steps:
      - name: 检出你的仓库代码
        uses: actions/checkout@v4

      - name: 安装ARM32交叉编译依赖
        run: |
          sudo apt update
          sudo apt install -y \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
            bc bison flex libssl-dev libncurses5-dev ccache kmod u-boot-tools

      - name: 恢复ccache编译缓存
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: "${{ runner.os }}-ccache-${{ env.KVER }}-${{ github.sha }}"
          restore-keys: |
            ${{ runner.os }}-ccache-${{ env.KVER }}-
            ${{ runner.os }}-ccache-

      - name: 拉取Linux内核源码
        run: |
          git clone --branch "$KVER" https://github.com/torvalds/linux.git linux_build

      - name: 拉取histb官方补丁仓库
        run: |
          git clone https://github.com/histb-mainline/patches.git histb-hi3798-patches
          if [ -n "${{ github.event.inputs.patches_commit }}" ]; then
            git -C histb-hi3798-patches checkout "${{ github.event.inputs.patches_commit }}"
          fi
          echo "=== 补丁总数统计 ==="
          ls -1 histb-hi3798-patches/*.patch | wc -l

      - name: 应用Hi3798MV100补丁
        env:
          CI: "true"
          PATCHES_DIR: ${{ github.workspace }}/histb-hi3798-patches
          LOG_FILE: ${{ github.workspace }}/patch_apply.log
        run: |
          chmod +x apply_hi3798mv100_v7.4_patches.sh
          cd linux_build
          bash ../apply_hi3798mv100_v7.4_patches.sh

      - name: 部署内核配置并补全依赖
        run: |
          cp kernel.config linux_build/.config
          cd linux_build
          make olddefconfig

      - name: 编译内核、设备树、模块
        run: |
          cd linux_build
          export CCACHE_DIR="$HOME/.ccache"
          ccache --max-size=5G
          ccache -z
          make -j$(nproc) CROSS_COMPILE="ccache $CROSS_COMPILE" zImage
          make -j$(nproc) CROSS_COMPILE="ccache $CROSS_COMPILE" dtbs
          make -j$(nproc) CROSS_COMPILE="ccache $CROSS_COMPILE" modules
          ccache -s

      - name: 整理四类独立产物
        run: |
          cd linux_build
          rm -rf out
          mkdir -p out
          KREL="$(make -s kernelrelease)"
          cp arch/arm/boot/zImage out/
          cp arch/arm/boot/dts/hisilicon/*.dtb out/
          cp .config "out/config-${KREL}-hi3798mv100"
          make INSTALL_MOD_PATH="$PWD/out/_mod" modules_install
          rm -f out/_mod/lib/modules/*/build out/_mod/lib/modules/*/source
          tar -czf out/modules.tar.gz -C out/_mod .
          rm -rf out/_mod
          ls -lh out/

      - name: 生成发布说明
        run: |
          cat > linux_build/release_notes.md <<EOF
          ## 海思 Hi3798MV100 内核构建
          | 项目 | 内容 |
          | --- | --- |
          | 芯片平台 | Hi3798MV100（ARMv7） |
          | 内核版本 | ${KVER} |
          | 补丁来源 | histb-mainline/patches 官方主线 |
          | 补丁提交 | ${{ github.event.inputs.patches_commit || 'master分支最新提交' }} |
          | 构建时间 | $(date -u +%Y-%m-%dT%H:%M:%SZ) |
          | 交叉工具链 | arm-linux-gnueabihf- |
          ### 产物清单
          - \`zImage\`：内核镜像
          - \`*.dtb\`：设备树文件
          - \`config-*\`：本次内核配置
          - \`modules.tar.gz\`：内核模块压缩包
          ### 刷机提示
          1. 刷写前务必备份原机固件与分区表
          2. zImage和dtb按对应分区写入
          3. modules.tar.gz解压后整体放到板端/lib/modules/目录
          EOF

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: hi3798mv100-linux-7.4
          if-no-files-found: error
          retention-days: 90
          path: |
            linux_build/out/zImage
            linux_build/out/*.dtb
            linux_build/out/config-*
            linux_build/out/modules.tar.gz

      - name: 发布到GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          body_path: linux_build/release_notes.md
          generate_release_notes: true
          files: |
            linux_build/out/zImage
            linux_build/out/*.dtb
            linux_build/out/config-*
            linux_build/out/modules.tar.gz
