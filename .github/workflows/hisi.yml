name: Hi3798MV100 内核自动构建

on:
  push:
    branches: [ master, main ]
    paths:
      - '.github/workflows/hisi.yml'
      - 'kernel.config'
      - 'apply_histb_patches.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-hi3798mv100:
    name: 编译 Hi3798MV100 内核+模块
    runs-on: ubuntu-22.04
    env:
      ARCH: arm
      CROSS_COMPILE: arm-linux-gnueabihf-
      UIMAGE_LOADADDR: "0x02000000"
      TARGET_DTB: hi3798mv100-ec6108v9c.dtb
      PATCHES_BASE_SHA: fd9230005e85472b81c1c7c16afe93dd878996b1
      PATCHES_KERNEL_VERSION: 7.4-rc2
      PATCHES_REPO: https://github.com/rmoyulong/histb-mainline_patches
      KERNEL_REPO: https://github.com/torvalds/linux.git
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 校验根目录必要文件
        run: |
          set -euo pipefail
          for f in apply_histb_patches.sh kernel.config; do
            if [ ! -f "$f" ]; then
              echo "::error::根目录缺少 $f"
              exit 1
            fi
          done
          chmod +x apply_histb_patches.sh
          echo "=== 根目录文件 ==="
          ls -lh apply_histb_patches.sh kernel.config

      - name: 安装交叉编译依赖
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
            bc bison flex libssl-dev libncurses5-dev ccache kmod u-boot-tools device-tree-compiler quilt \
            git wget xz-utils
          echo "=== 编译器版本 ==="
          arm-linux-gnueabihf-gcc --version | awk 'NR==1{print; exit}'

      - name: 拉取内核源码（严格匹配补丁基线commit）
        run: |
          set -euo pipefail
          echo "拉取内核基线：$PATCHES_KERNEL_VERSION (commit: $PATCHES_BASE_SHA)"
          git clone --filter=blob:none --no-checkout "$KERNEL_REPO" linux_build
          cd linux_build
          git checkout -q "$PATCHES_BASE_SHA"
          KVER_ACTUAL=$(make -s kernelversion)
          echo "实际内核版本：$KVER_ACTUAL"
          # 兼容官方输出的7.4.0-rc2和补丁库简写7.4-rc2
          norm() { printf '%s' "$1" | sed -E 's/^([0-9]+\.[0-9]+)\.0/\1/'; }
          if [ "$(norm "$KVER_ACTUAL")" != "$(norm "$PATCHES_KERNEL_VERSION")" ]; then
            echo "::error::版本不匹配：期望 $PATCHES_KERNEL_VERSION，实际 $KVER_ACTUAL"
            exit 1
          fi
          echo "版本校验通过"

      - name: 拉取补丁仓库并检查布局
        run: |
          set -euo pipefail
          git clone --depth 1 "$PATCHES_REPO" histb-patches
          cd histb-patches
          echo "=== 补丁库baseline ==="
          grep -E 'KERNEL_VERSION|BASE_SHA' baseline
          echo "=== 补丁库布局检查 ==="
          PATCH_COUNT=$(find . -maxdepth 1 -name '*.patch' | wc -l)
          echo "根目录补丁数量：$PATCH_COUNT"
          echo "前3个补丁："
          mapfile -t patches < <(find . -maxdepth 1 -name '*.patch' | LC_ALL=C sort -V | head -n 3)
          for p in "${patches[@]}"; do echo "  $p"; done
          [ -f quilt.conf ] && echo "存在quilt.conf（--fuzz=0严格校验）"
          [ -f series ] && echo "存在series清单" || echo "无series清单，按文件名顺序应用补丁"

      - name: 应用histb补丁
        run: |
          set -euo pipefail
          cd linux_build
          PATCHES_DIR="../histb-patches" CI=true bash ../apply_histb_patches.sh -y
          echo "=== 板级DTB检查 ==="
          DTS_FILES=(arch/arm/boot/dts/hisilicon/hi3798mv100*.dts)
          if [ ${#DTS_FILES[@]} -gt 0 ] && [ -f "${DTS_FILES[0]}" ]; then
            ls arch/arm/boot/dts/hisilicon/hi3798mv100*.dts | head -10
            echo "EC6108相关DTB："
            grep -l "ec6108" arch/arm/boot/dts/hisilicon/*.dts 2>/dev/null || true
          else
            echo "::warning::未找到Hi3798MV100 DTS文件"
          fi

      - name: 配置内核并强制关键驱动内置
        run: |
          set -euo pipefail
          cd linux_build
          cp ../kernel.config .config

          # 按依赖顺序开启启动必需驱动，避免Kconfig自动屏蔽
          # 块层与eMMC核心
          scripts/config --enable BLOCK --enable MMC --enable MMC_BLOCK
          # SDHCI通用框架
          scripts/config --enable MMC_SDHCI --enable MMC_SDHCI_PLTFM --enable MMC_SDHCI_OF
          # DesignWare MMC核心（海思SDHCI依赖）
          scripts/config --enable MMC_DW
          # Hi3798MV100专属eMMC驱动
          scripts/config --enable MMC_HISI_SDHCI
          # 控制台串口PL011
          scripts/config --enable SERIAL_AMBA_PL011 --enable SERIAL_AMBA_PL011_CONSOLE --enable SERIAL_CORE
          # EXT4文件系统及依赖
          scripts/config --enable EXT4_FS --enable EXT4_USE_FOR_EXT2 --enable JBD2 --enable FS_MBCACHE
          # DTB支持（海思fastboot要求）
          scripts/config --enable ARM_APPENDED_DTB --enable ARM_ATAG_DTB_COMPAT --enable USE_OF
          # 关闭KASLR避免启动问题
          scripts/config --disable RANDOMIZE_BASE
          # cmdline从bootargs分区取，不硬写
          scripts/config --set-str CMDLINE ""
          scripts/config --enable CMDLINE_FROM_BOOTLOADER --disable CMDLINE_FORCE

          make olddefconfig

          echo "=== 关键配置校验 ==="
          REQUIRED_CONFIGS=(
            "CONFIG_ARM_APPENDED_DTB"
            "CONFIG_SERIAL_AMBA_PL011"
            "CONFIG_SERIAL_AMBA_PL011_CONSOLE"
            "CONFIG_MMC"
            "CONFIG_MMC_BLOCK"
            "CONFIG_MMC_HISI_SDHCI"
            "CONFIG_EXT4_FS"
          )
          for cfg in "${REQUIRED_CONFIGS[@]}"; do
            if grep -q "^${cfg}=y" .config; then
              echo "✅ $cfg 已开启"
            else
              echo "::error::$cfg 未开启！"
              exit 1
            fi
          done

      - name: 编译内核、设备树、模块
        run: |
          set -euo pipefail
          cd linux_build
          export CCACHE_DIR="$HOME/.ccache"
          ccache --max-size=5G
          ccache -z
          make -j"$(nproc)" CROSS_COMPILE="ccache $CROSS_COMPILE" zImage
          make -j"$(nproc)" CROSS_COMPILE="ccache $CROSS_COMPILE" dtbs
          make -j"$(nproc)" CROSS_COMPILE="ccache $CROSS_COMPILE" modules
          ccache -s

      - name: 打包uImage（严格对齐实机格式）
        run: |
          set -euo pipefail
          cd linux_build
          DTB_PATH="arch/arm/boot/dts/hisilicon/$TARGET_DTB"
          if [ ! -f "$DTB_PATH" ]; then
            echo "::error::设备树不存在：$DTB_PATH"
            echo "可用的Hi3798设备树："
            ls arch/arm/boot/dts/hisilicon/hi3798mv100*.dtb 2>/dev/null || echo "无"
            exit 1
          fi
          # 追加DTB到zImage末尾
          cat arch/arm/boot/zImage "$DTB_PATH" > zImage-dtb
          ZSIZE=$(stat -c%s arch/arm/boot/zImage)
          DTB_MAGIC=$(dd if=zImage-dtb bs=1 skip=$ZSIZE count=4 2>/dev/null | od -A n -t x1 | tr -d ' \n\t')
          echo "DTB起始魔数：$DTB_MAGIC（应为d00dfeed）"
          if [ "$DTB_MAGIC" != "d00dfeed" ]; then
            echo "::error::DTB追加位置错误"
            exit 1
          fi
          # 打包uImage，地址0x02000000，无压缩
          mkimage -A arm -O linux -T kernel -C none \
            -a "$UIMAGE_LOADADDR" -e "$UIMAGE_LOADADDR" \
            -n "Linux-$PATCHES_KERNEL_VERSION-hi3798mv100" \
            -d zImage-dtb arch/arm/boot/uImage
          echo "=== uImage头信息 ==="
          mkimage -l arch/arm/boot/uImage
          USIZE=$(stat -c%s arch/arm/boot/uImage)
          echo "uImage总大小：$USIZE 字节"

      - name: 整理产物
        run: |
          set -euo pipefail
          cd linux_build
          rm -rf out
          mkdir -p out
          KREL=$(make -s kernelrelease)
          cp arch/arm/boot/uImage out/uImage
          cp arch/arm/boot/zImage out/zImage
          cp arch/arm/boot/dts/hisilicon/*.dtb out/
          cp .config "out/config-${KREL}"
          make INSTALL_MOD_PATH="$PWD/out/_mod" modules_install
          rm -f out/_mod/lib/modules/*/build out/_mod/lib/modules/*/source
          tar -czf out/modules.tar.gz -C out/_mod .
          rm -rf out/_mod
          echo "=== 最终产物 ==="
          ls -lh out/
          echo "内核版本：$KREL"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: hi3798mv100-linux-7.4-rc2
          if-no-files-found: error
          retention-days: 90
          path: linux_build/out/*
