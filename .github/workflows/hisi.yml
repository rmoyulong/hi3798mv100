name: Hi3798MV100 内核自动构建

on:
  push:
    branches: [ master, main ]
    paths:
      - '.github/workflows/hisi.yml'
      - 'kernel.config'
  workflow_dispatch:
    inputs:
      kernel_version:
        description: '内核版本（默认7.3-rc7，和作者验证版一致）'
        required: false
        default: '7.3-rc7'

permissions:
  contents: write

jobs:
  build-hi3798mv100:
    name: 编译 Hi3798MV100 内核+模块
    runs-on: ubuntu-22.04  # 用22.04的GCC11，对老ARM内核兼容性更好，不要用最新的24.04
    env:
      ARCH: arm
      CROSS_COMPILE: arm-linux-gnueabihf-
      # 固定地址，与作者7.3-rc7镜像一致
      UIMAGE_LOADADDR: "0x02000000"
      TARGET_DTB: hi3798mv100-ec6108v9c.dtb
      # 作者仓库地址
      AUTHOR_REPO: https://github.com/rmoyulong/hi3798mv100.git
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 安装ARM32交叉编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
            bc bison flex libssl-dev libncurses5-dev ccache kmod u-boot-tools device-tree-compiler \
            git wget xz-utils
          # GCC11在ubuntu22.04，避免太新编译器的问题
          arm-linux-gnueabihf-gcc --version

      - name: 拉取作者仓库获取参考配置和补丁
        run: |
          set -euo pipefail
          git clone --depth 1 "$AUTHOR_REPO" author-repo
          echo "作者仓库文件："
          ls -lh author-repo/
          # 如果作者仓库有他自己的kernel.config，直接用他的，不用我们猜的
          if [ -f author-repo/kernel.config ]; then
            cp author-repo/kernel.config ./kernel.config
            echo "使用作者仓库自带kernel.config"
          fi

      - name: 拉取内核源码
        env:
          KVER: ${{ github.event.inputs.kernel_version }}
        run: |
          set -euo pipefail
          echo "构建内核版本：v$KVER"
          git clone --depth 1 --branch "v$KVER" https://github.com/torvalds/linux.git linux_build
          cd linux_build
          echo "内核版本：$(make kernelversion)"

      - name: 应用histb补丁（对应7.3-rc7版本分支）
        run: |
          set -euo pipefail
          git clone --depth 1 --branch master https://github.com/histb-mainline/patches.git histb-patches
          cd linux_build
          # 应用补丁，跳过不兼容的补丁
          for p in ../histb-patches/*.patch; do
            echo "应用补丁：$p"
            patch -p1 --forward --no-backup-if-mismatch < "$p" || echo "跳过不兼容补丁：$p"
          done

      - name: 部署内核配置并强制关键驱动内置
        run: |
          set -euo pipefail
          cd linux_build
          cp ../kernel.config .config

          # === 强制所有启动必需驱动编进内核（绝对不能是模块）===
          # 控制台串口PL011（早期启动必须有，否则panic看不到输出）
          scripts/config --enable SERIAL_AMBA_PL011 --enable SERIAL_AMBA_PL011_CONSOLE
          # eMMC/SD卡驱动
          scripts/config --enable MMC --enable MMC_HISI --enable MMC_SDHCI --enable MMC_SDHCI_PLTFM
          # ext4根文件系统
          scripts/config --enable EXT4_FS --enable EXT4_USE_FOR_EXT2
          # DTB追加支持（海思fastboot不单独传DTB）
          scripts/config --enable ARM_APPENDED_DTB --enable ARM_ATAG_DTB_COMPAT
          scripts/config --enable USE_OF
          # 关闭KASLR等会导致启动失败的调试特性
          scripts/config --disable RANDOMIZE_BASE
          # 不强制内置cmdline，用bootargs分区传的参数（和作者一致）
          scripts/config --set-str CMDLINE ""
          scripts/config --enable CMDLINE_FROM_BOOTLOADER --disable CMDLINE_FORCE

          make olddefconfig

          echo "=== 关键配置最终验证 ==="
          for s in SERIAL_AMBA_PL011 SERIAL_AMBA_PL011_CONSOLE MMC_HISI EXT4_FS ARM_APPENDED_DTB; do
            v=$(grep -E "^CONFIG_${s}=" .config || echo "未设置（错误）")
            echo "CONFIG_$s = $v"
          done

      - name: 编译内核、设备树、模块
        run: |
          cd linux_build
          export CCACHE_DIR="$HOME/.ccache"
          ccache --max-size=5G
          ccache -z
          # 先编译zImage
          make -j"$(nproc)" CROSS_COMPILE="ccache $CROSS_COMPILE" zImage
          # 编译设备树
          make -j"$(nproc)" CROSS_COMPILE="ccache $CROSS_COMPILE" dtbs
          # 编译模块
          make -j"$(nproc)" CROSS_COMPILE="ccache $CROSS_COMPILE" modules
          ccache -s

      - name: 严格按作者方式打包uImage（和7.3.0镜像结构完全一致）
        run: |
          set -euo pipefail
          cd linux_build
          DTB_PATH="arch/arm/boot/dts/hisilicon/$TARGET_DTB"
          if [ ! -f "$DTB_PATH" ]; then
            echo "::error::设备树不存在：$DTB_PATH"
            ls arch/arm/boot/dts/hisilicon/hi3798mv100*.dtb
            exit 1
          fi
          # 1. 追加DTB到zImage末尾
          cat arch/arm/boot/zImage "$DTB_PATH" > zImage-dtb
          # 验证zImage末尾正好是DTB开头（和作者镜像结构一致）
          ZSIZE=$(stat -c%s arch/arm/boot/zImage)
          echo "zImage大小：$ZSIZE 字节"
          DTB_MAGIC=$(dd if=zImage-dtb bs=1 skip=$ZSIZE count=4 2>/dev/null | od -A n -t x1 | tr -d ' \n')
          echo "DTB起始魔数：$DTB_MAGIC（应为d00dfeed）"
          [ "$DTB_MAGIC" != "d00dfeed" ] && { echo "DTB追加位置错误！"; exit 1; }
          # 2. 打包uImage，地址严格0x02000000，不压缩（-C none）
          mkimage -A arm -O linux -T kernel -C none \
            -a "$UIMAGE_LOADADDR" -e "$UIMAGE_LOADADDR" \
            -n "Linux-$KVER-hi3798mv100" \
            -d zImage-dtb arch/arm/boot/uImage
          # 3. 验证uImage头，和作者镜像对比
          echo "=== 生成uImage头信息 ==="
          mkimage -l arch/arm/boot/uImage
          USIZE=$(stat -c%s arch/arm/boot/uImage)
          echo "uImage总大小：$USIZE 字节（作者7.3.0是7328134字节，7.3同版本应该接近）"

      - name: 整理产物
        run: |
          cd linux_build
          rm -rf out
          mkdir -p out
          KREL="$(make -s kernelrelease)"
          cp arch/arm/boot/uImage out/uImage
          cp arch/arm/boot/zImage out/zImage
          cp arch/arm/boot/dts/hisilicon/*.dtb out/
          cp .config "out/config-${KREL}"
          make INSTALL_MOD_PATH="$PWD/out/_mod" modules_install
          rm -f out/_mod/lib/modules/*/build out/_mod/lib/modules/*/source
          tar -czf out/modules.tar.gz -C out/_mod .
          rm -rf out/_mod
          echo "=== 最终产物 ==="
          ls -lh out/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: hi3798mv100-linux-${{ github.event.inputs.kernel_version }}
          if-no-files-found: error
          retention-days: 90
          path: linux_build/out/*
