name: Hi3798MV100 内核自动构建

on:
  push:
    # 兼容 master 与 main，默认分支推哪个都触发
    branches: [ master, main ]
    paths:
      - '.github/workflows/hisi.yml'
      - 'apply_histb_patches.sh'
      - 'kernel.config'
  workflow_dispatch:
    inputs:
      kernel_version:
        description: '内核版本，留空 = 按补丁仓库 baseline 自动选择'
        required: false
        default: ''
      patches_commit:
        description: '补丁仓库 commit，留空 = master 最新'
        required: false
        default: ''
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-hi3798mv100:
    name: 编译 Hi3798MV100 内核+模块
    runs-on: ubuntu-latest
    env:
      ARCH: arm
      CROSS_COMPILE: arm-linux-gnueabihf-
      KERNEL_REPO: https://github.com/torvalds/linux.git
      # uImage 头里写入的加载/入口地址，与实机可启动的 7.3.0 / 4.4.35 镜像一致
      # 必须加引号，否则 YAML 会把它当十进制整数，写进头里就不是 0x02000000
      UIMAGE_LOADADDR: "0x02000000"
      # 要追加到 zImage 尾部的板级设备树，实机可启动镜像内嵌的就是这颗
      TARGET_DTB: hi3798mv100-ec6108v9c.dtb
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 安装 ARM32 交叉编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
            bc bison flex libssl-dev libncurses5-dev ccache kmod u-boot-tools

      # 内核版本完全由补丁仓库的 baseline 决定，不再写死在 YAML 里
      - name: 拉取补丁仓库并解析 baseline
        env:
          INPUT_VERSION: ${{ github.event.inputs.kernel_version }}
          PATCHES_COMMIT: ${{ github.event.inputs.patches_commit }}
        run: |
          set -euo pipefail
          git clone https://github.com/histb-mainline/patches.git histb-hi3798-patches
          if [ -n "$PATCHES_COMMIT" ]; then
            git -C histb-hi3798-patches checkout "$PATCHES_COMMIT"
          fi
          echo "补丁仓库提交：$(git -C histb-hi3798-patches rev-parse --short HEAD)"

          BL=histb-hi3798-patches/baseline
          if [ ! -f "$BL" ]; then
            echo "::error::补丁仓库中未找到 baseline 文件"
            exit 1
          fi
          BASE_VERSION="$(sed -n 's/^[[:space:]]*KERNEL_VERSION[[:space:]]*:=[[:space:]]*//p' "$BL" | head -1 | tr -d '\r' | xargs)"
          BASE_SHA="$(sed -n 's/^[[:space:]]*BASE_SHA[[:space:]]*:=[[:space:]]*//p' "$BL" | head -1 | tr -d '\r' | xargs)"
          echo "baseline 内核版本：${BASE_VERSION:-（缺失）}"
          echo "baseline 基准对象：${BASE_SHA:-（缺失）}"

          if [ -n "$INPUT_VERSION" ]; then
            KVER="$INPUT_VERSION"
            echo "使用手动指定版本覆盖 baseline"
          else
            KVER="$BASE_VERSION"
          fi
          KVER="${KVER#v}"
          if [ -z "$KVER" ]; then
            echo "::error::未能从 baseline 解析出 KERNEL_VERSION"
            exit 1
          fi
          KERNEL_TAG="v$KVER"
          if ! git ls-remote --exit-code --tags "$KERNEL_REPO" "refs/tags/$KERNEL_TAG" >/dev/null; then
            echo "::error::$KERNEL_REPO 中不存在标签 $KERNEL_TAG"
            exit 1
          fi
          echo "KVER=$KVER" >> "$GITHUB_ENV"
          echo "KERNEL_TAG=$KERNEL_TAG" >> "$GITHUB_ENV"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          {
            echo "## 本次构建基线"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| baseline 内核版本 | $BASE_VERSION |"
            echo "| 实际使用标签 | $KERNEL_TAG |"
            echo "| baseline 基准对象 | $BASE_SHA |"
            echo "| uImage 加载/入口地址 | $UIMAGE_LOADADDR |"
            echo "| 追加设备树 | $TARGET_DTB |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 恢复 ccache 缓存
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: "${{ runner.os }}-ccache-${{ env.KVER }}-${{ github.sha }}"
          restore-keys: |
            ${{ runner.os }}-ccache-${{ env.KVER }}-
            ${{ runner.os }}-ccache-

      - name: 拉取内核源码（按 baseline 版本）
        run: |
          git clone --branch "$KERNEL_TAG" "$KERNEL_REPO" linux_build

      - name: 校验内核树与 baseline 基准一致
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ]; then
            echo "::warning::baseline 未提供 BASE_SHA，跳过基准校验"
            exit 0
          fi
          # baseline 里的 BASE_SHA 是「取工作树用的提交号」，可能是缩写形式，
          # 而 rev-parse <tag> 对附注标签返回的是标签对象、不是提交，两者不能直接比。
          # 这里同时取提交号与标签对象，并允许缩写前缀匹配，避免误报。
          TAG_COMMIT="$(git -C linux_build rev-parse "${KERNEL_TAG}^{commit}")"
          TAG_OBJ="$(git -C linux_build rev-parse "$KERNEL_TAG")"
          echo "本地标签提交号：$TAG_COMMIT"
          echo "本地标签对象号：$TAG_OBJ"
          echo "baseline 基准：$BASE_SHA"
          if [ "$TAG_COMMIT" = "$BASE_SHA" ] || [ "$TAG_OBJ" = "$BASE_SHA" ] \
             || [ "${TAG_COMMIT#"$BASE_SHA"}" != "$TAG_COMMIT" ] \
             || [ "${TAG_OBJ#"$BASE_SHA"}" != "$TAG_OBJ" ]; then
            echo "内核树与 baseline 完全一致"
          else
            echo "::warning::内核树与 baseline 基准不一致，补丁可能出现上下文差异"
          fi

      # 脚本与日志都不落在 linux_build 内，内核 git 工作区保持干净
      - name: 应用 histb 补丁
        env:
          CI: "true"
          PATCHES_DIR: ${{ github.workspace }}/histb-hi3798-patches
          LOG_FILE: ${{ github.workspace }}/patch_apply.log
        run: |
          chmod +x apply_histb_patches.sh
          cd linux_build
          bash ../apply_histb_patches.sh

      - name: 部署内核配置并补全依赖
        run: |
          set -euo pipefail
          cd linux_build
          cp ../kernel.config .config
          # 打开HDMI辅助层，避免sii9134链接失败
          scripts/config --enable DRM_DISPLAY_HELPER --enable DRM_DISPLAY_HDMI_HELPER
          make olddefconfig

          echo "=== 相关开关最终取值 ==="
          for s in ARM_APPENDED_DTB ARM_ATAG_DTB_COMPAT SERIAL_AMBA_PL011 SERIAL_AMBA_PL011_CONSOLE DRM_DISPLAY_HELPER DRM_DISPLAY_HDMI_HELPER KERNEL_XZ; do
            printf '%-28s %s\n' "$s" "$(grep -E "^CONFIG_${s}=|^# CONFIG_${s} is not set" .config || echo '（不存在）')"
          done

          # 自解压代码只在开启该选项时才去识别追加的设备树，关掉则 uImage 里的 dtb 形同不存在
          if ! grep -q '^CONFIG_ARM_APPENDED_DTB=y' .config; then
            echo "::error::CONFIG_ARM_APPENDED_DTB 未开启，追加的设备树不会被识别"
            exit 1
          fi

      - name: 编译内核、设备树、模块
        run: |
          cd linux_build
          export CCACHE_DIR="$HOME/.ccache"
          ccache --max-size=5G
          ccache -z
          make -j"$(nproc)" CROSS_COMPILE="ccache $CROSS_COMPILE" zImage
          make -j"$(nproc)" CROSS_COMPILE="ccache $CROSS_COMPILE" dtbs
          make -j"$(nproc)" CROSS_COMPILE="ccache $CROSS_COMPILE" modules
          ccache -s

      - name: 追加设备树、打包 uImage 并整理五类产物
        run: |
          set -euo pipefail
          cd linux_build
          rm -rf out
          mkdir -p out
          KREL="$(make -s kernelrelease)"

          Z=arch/arm/boot/zImage
          DTB_PATH="arch/arm/boot/dts/hisilicon/${TARGET_DTB}"
          if [ ! -f "$DTB_PATH" ]; then
            echo "::error::目标设备树不存在：$DTB_PATH"
            ls arch/arm/boot/dts/hisilicon/ | grep -i hi3798mv100 || true
            exit 1
          fi

          # 自解压代码按 zImage 头部偏移 0x2C 记录的值（zImage 末端）去定位追加的设备树，
          # 设备树必须正好落在那个偏移上，否则内核找不到 dtb，在 fastboot 下必然启动失败
          EXPECT_OFF="$(python3 -c 'import struct;d=open("arch/arm/boot/zImage","rb").read();print(struct.unpack("<I",d[44:48])[0])')"
          ZSIZE="$(stat -c%s "$Z")"
          echo "zImage 大小：$ZSIZE"
          echo "头部记录的 zImage 末端偏移：$EXPECT_OFF"

          if [ "$EXPECT_OFF" -eq 0 ] || [ "$EXPECT_OFF" -gt 67108864 ]; then
            echo "::warning::头部未记录有效末端偏移，按 zImage 实际大小直接追加"
            EXPECT_OFF="$ZSIZE"
          elif [ "$EXPECT_OFF" -gt "$ZSIZE" ]; then
            echo "按头部记录把 zImage 补零到 $EXPECT_OFF"
            truncate -s "$EXPECT_OFF" "$Z"
          elif [ "$EXPECT_OFF" -ne "$ZSIZE" ]; then
            echo "::error::头部末端偏移($EXPECT_OFF)与 zImage 实际大小($ZSIZE)不一致，追加的设备树无法被识别"
            exit 1
          fi

          DTBSZ="$(stat -c%s "$DTB_PATH")"
          echo "追加设备树：$DTB_PATH（$DTBSZ 字节）"
          if [ "$DTBSZ" -gt 1048576 ]; then
            echo "::warning::设备树超过 1MB，自解压代码会拒绝使用追加的设备树"
          fi

          cat "$Z" "$DTB_PATH" > arch/arm/boot/zImage-dtb

          # 追加结果自检：魔数位置、totalsize 与实际追加长度必须三方一致
          python3 -c "import struct;b=open('arch/arm/boot/zImage-dtb','rb').read();off=int('$EXPECT_OFF');sig=b[off:off+4];assert sig==b'\xd0\x0d\xfe\xed','offset %d has no DTB magic: %r' % (off,sig);tot=struct.unpack('>I',b[off+4:off+8])[0];assert tot==len(b)-off,'DTB totalsize %d != appended %d' % (tot,len(b)-off);print('DTB 位置与长度校验通过：offset=%d totalsize=%d' % (off,tot))"
          # 1. zImage 内核镜像（内核自解压格式，不含设备树，留档用）
          cp "$Z" out/
          # 2. uImage 内核镜像（zImage+设备树，外面加 64 字节 U-Boot 头）
          if ! command -v mkimage >/dev/null 2>&1; then
            echo "::error::未找到 mkimage，请确认已安装 u-boot-tools"
            exit 1
          fi
          mkimage -A arm -O linux -T kernel -C none \
            -a "$UIMAGE_LOADADDR" -e "$UIMAGE_LOADADDR" \
            -n "Linux-${KREL}" \
            -d arch/arm/boot/zImage-dtb out/uImage
          # 3. dtb 设备树（单独留档）
          cp arch/arm/boot/dts/hisilicon/*.dtb out/
          # 4. config 内核配置
          cp .config "out/config-${KREL}-hi3798mv100"
          # 5. modules.tar.gz 内核模块
          make INSTALL_MOD_PATH="$PWD/out/_mod" modules_install
          rm -f out/_mod/lib/modules/*/build out/_mod/lib/modules/*/source
          tar -czf out/modules.tar.gz -C out/_mod .
          rm -rf out/_mod
          echo "=== 产物列表 ==="
          ls -lh out/
          echo "=== uImage 头信息 ==="
          mkimage -l out/uImage
          echo "=== uImage 尾部是否确为设备树 ==="
          python3 -c "d=open('out/uImage','rb').read();zl=int('$EXPECT_OFF');print('uImage 总长 %d = 头 64 + zImage %d + 设备树 %d' % (len(d),zl,len(d)-64-zl));print('偏移 %d 处魔数: %s' % (64+zl,d[64+zl:64+zl+4].hex()))"

      - name: 生成发布说明
        run: |
          cat > linux_build/release_notes.md <<EOF
          ## 海思 Hi3798MV100 内核构建

          | 项目 | 内容 |
          | --- | --- |
          | 芯片平台 | Hi3798MV100（ARMv7） |
          | baseline 版本 | ${KVER} |
          | 内核标签 | ${KERNEL_TAG} |
          | baseline 基准 | ${BASE_SHA} |
          | uImage 加载/入口地址 | ${UIMAGE_LOADADDR} |
          | 内嵌设备树 | ${TARGET_DTB} |
          | 补丁来源 | histb-mainline/patches 官方补丁库 |
          | 补丁提交 | ${{ github.event.inputs.patches_commit || 'master 最新提交' }} |
          | 构建时间 | $(date -u +%Y-%m-%dT%H:%M:%SZ) |
          | 交叉工具链 | arm-linux-gnueabihf- |

          ### 产物清单
          - \`uImage\`：**直接刷入内核分区**，已内嵌设备树，dd if=uImage of=/dev/mmcblk0p6
          - \`zImage\`：不含设备树的内核自解压镜像，仅留档
          - \`*.dtb\`：单独的板级设备树文件，留档
          - \`config-*\`：本次内核配置
          - \`modules.tar.gz\`：内核模块，解压到板端根目录 /

          ### 刷机提示
          1. 刷写前务必备份原机固件与分区表
          2. uImage 直接写入 kernel 分区，不需要再单独刷 dtb
          3. modules.tar.gz 解压后整体放到板端根目录（/），重启前先解压
          EOF

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: hi3798mv100-linux
          if-no-files-found: error
          retention-days: 90
          path: |
            linux_build/out/zImage
            linux_build/out/uImage
            linux_build/out/*.dtb
            linux_build/out/config-*
            linux_build/out/modules.tar.gz

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hi3798mv100-latest
          name: "Hi3798MV100 内核构建（${{ env.KERNEL_TAG }}）"
          body_path: linux_build/release_notes.md
          generate_release_notes: true
          files: |
            linux_build/out/zImage
            linux_build/out/uImage
            linux_build/out/*.dtb
            linux_build/out/config-*
            linux_build/out/modules.tar.gz
