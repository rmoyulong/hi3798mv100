name: Hi3798MV100 内核自动构建

# 修订说明（v4）：
# 1) 基线跟随补丁库 baseline：KERNEL_VERSION = 7.4-rc2，BASE_SHA = fd9230005e85...
# 2) 版本校验改为"规范化后比较"（去掉 X.Y.0 里的 .0），
#    因此 7.4-rc2 与内核自报的 7.4.0-rc2 视为同一版本
# 3) 补丁库为"根目录平铺 quilt 库"：无 pending-7.4/hack-7.4 桶目录、无 series；
#    补丁应用继续调用仓库根目录的 apply_histb_patches.sh
# 4) 【本版关键修正】eMMC 驱动符号：
#    Hi3798MV100 的 mmc 节点 compatible = "hisilicon,hi3798cv200-dw-mshc"，
#    对应 DesignWare MMC 的 CV200 扩展驱动，正确符号为
#      CONFIG_MMC_DW=y / CONFIG_MMC_DW_PLTFM=y / CONFIG_MMC_DW_HI3798CV200=y
#    内核里并不存在 CONFIG_MMC_HISI / CONFIG_MMC_HISI_SDHCI，已全部移除
# 5) 去掉所有会提前关闭管道的 `| head`，避免 SIGPIPE 造成的假失败
# 6) uImage 保持加载/入口 0x02000000、-C none，设备树追加在 zImage 末尾并校验 d00dfeed

on:
  push:
    branches: [ master, main ]
    paths:
      - '.github/workflows/hisi.yml'
      - 'kernel.config'
      - 'apply_histb_patches.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-hi3798mv100:
    name: 编译 Hi3798MV100 内核+模块
    runs-on: ubuntu-22.04
    env:
      ARCH: arm
      CROSS_COMPILE: arm-linux-gnueabihf-
      KERNEL_REPO: https://github.com/torvalds/linux.git
      # 补丁仓库（你改名后的地址）
      PATCHES_REPO: https://github.com/rmoyulong/histb-mainline_patches
      # 与补丁库 baseline 逐字一致
      PATCHES_BASE_SHA: fd9230005e85472b81c1c7c16afe93dd878996b1
      PATCHES_KERNEL_VERSION: 7.4-rc2
      # uImage 头内地址，与实机验证过的镜像一致
      UIMAGE_LOADADDR: "0x02000000"
      TARGET_DTB: hi3798mv100-ec6108v9c.dtb

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 校验必要文件存在
        run: |
          set -euo pipefail
          for f in apply_histb_patches.sh kernel.config; do
            [ -f "$f" ] || { echo "::error::根目录缺少 $f"; exit 1; }
          done
          chmod +x apply_histb_patches.sh
          ls -lh apply_histb_patches.sh kernel.config

      - name: 安装 ARM32 交叉编译依赖
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
            bc bison flex libssl-dev libncurses5-dev ccache kmod \
            u-boot-tools device-tree-compiler quilt git wget xz-utils
          arm-linux-gnueabihf-gcc --version | sed -n '1p'

      - name: 拉取内核源码（匹配补丁基线 commit）
        run: |
          set -euo pipefail
          echo "拉取内核基线：$PATCHES_KERNEL_VERSION (commit: $PATCHES_BASE_SHA)"
          git clone --filter=blob:none --no-checkout "$KERNEL_REPO" linux_build
          cd linux_build
          git checkout -q "$PATCHES_BASE_SHA"

          # 规范化：7.4.0-rc2 -> 7.4-rc2，使两种写法等价
          norm() { printf '%s' "$1" | sed -E 's/^([0-9]+\.[0-9]+)\.0/\1/'; }
          ACT="$(make -s kernelversion)"
          EXP="$PATCHES_KERNEL_VERSION"
          echo "实际内核版本：$ACT ；baseline 期望：$EXP"
          if [ "$(norm "$ACT")" != "$(norm "$EXP")" ]; then
            echo "::error::版本不匹配：期望 $EXP，实际 $ACT"
            exit 1
          fi
          echo "版本校验通过：$ACT"

      - name: 拉取补丁仓库
        run: |
          set -euo pipefail
          git clone --depth 1 "$PATCHES_REPO" histb-patches
          cd histb-patches
          echo "=== 补丁库 baseline ==="
          grep -E 'KERNEL_VERSION|BASE_SHA' baseline || true
          echo "=== 补丁库布局检查（根目录平铺 quilt 库）==="
          # mapfile 一次读完，不用 head，避免 SIGPIPE
          mapfile -t patches < <(find . -maxdepth 1 -name '*.patch' -type f | LC_ALL=C sort -V)
          echo "根目录补丁数量：${#patches[@]}"
          if [ "${#patches[@]}" -eq 0 ]; then
            echo "::error::补丁库根目录下没有 .patch 文件"
            exit 1
          fi
          echo "前3个补丁："
          for p in "${patches[@]:0:3}"; do echo "  $p"; done
          if [ -f quilt.conf ]; then
            echo "quilt.conf 存在（--fuzz=0）"
          else
            echo "::warning::未见 quilt.conf"
          fi
          if [ -f series ]; then
            echo "存在 series，脚本将按 series 顺序应用"
          else
            echo "无 series，脚本将按文件名序号排序应用全部补丁"
          fi

      - name: 应用 histb 补丁（调用仓库根目录 apply_histb_patches.sh）
        run: |
          set -euo pipefail
          cd linux_build
          # 该脚本自判：有 series 按 series，没有则按文件名序号应用根目录全部 *.patch；
          # 等价于 quilt --fuzz=0，遇冲突即中止并回滚，不会静默产出缺补丁的内核
          PATCHES_DIR="../histb-patches" CI=true bash ../apply_histb_patches.sh -y
          echo "=== 板级 dts 检查 ==="
          ls arch/arm/boot/dts/hisilicon/hi3798mv100*.dts 2>/dev/null || true
          grep -l "ec6108" arch/arm/boot/dts/hisilicon/*.dts 2>/dev/null || true

      - name: 部署内核配置并强制关键驱动内置
        run: |
          set -euo pipefail
          cd linux_build
          [ -f ../kernel.config ] || { echo "::error::仓库根目录缺少 kernel.config"; exit 1; }
          cp ../kernel.config .config

          # eMMC：mv100 的 mmc 节点 compatible = "hisilicon,hi3798cv200-dw-mshc"
          #   -> DesignWare MMC 的 CV200 扩展驱动
          scripts/config --enable MMC
          scripts/config --enable MMC_BLOCK
          scripts/config --enable MMC_DW
          scripts/config --enable MMC_DW_PLTFM
          scripts/config --enable MMC_DW_HI3798CV200
          # 控制台串口
          scripts/config --enable SERIAL_AMBA_PL011
          scripts/config --enable SERIAL_AMBA_PL011_CONSOLE
          # 根文件系统
          scripts/config --enable EXT4_FS
          scripts/config --enable EXT4_USE_FOR_EXT2
          scripts/config --enable JBD2
          scripts/config --enable FS_MBCACHE
          # 追加设备树 / ATAG 兼容
          scripts/config --enable ARM_APPENDED_DTB
          scripts/config --enable ARM_ATAG_DTB_COMPAT
          scripts/config --enable USE_OF
          scripts/config --disable RANDOMIZE_BASE
          # 启动参数交给 bootargs 分区传，不在内核里写死 root=
          scripts/config --set-str CMDLINE ""
          scripts/config --enable CMDLINE_FROM_BOOTLOADER
          scripts/config --disable CMDLINE_FORCE

          make olddefconfig

          echo "=== 关键配置最终取值 ==="
          for s in ARM_APPENDED_DTB ARM_ATAG_DTB_COMPAT USE_OF \
                   SERIAL_AMBA_PL011 SERIAL_AMBA_PL011_CONSOLE \
                   MMC MMC_BLOCK MMC_DW MMC_DW_PLTFM MMC_DW_HI3798CV200 \
                   EXT4_FS JBD2 FS_MBCACHE; do
            if grep -qE "^CONFIG_${s}=y$" .config; then
              echo "OK   CONFIG_${s}=y"
            else
              echo "::error::CONFIG_$s 未开启"
              exit 1
            fi
          done
          echo "=== 最终内核版本 ==="
          make -s kernelrelease

      - name: 编译内核、设备树、模块
        run: |
          set -euo pipefail
          cd linux_build
          export CCACHE_DIR="$HOME/.ccache"
          ccache --max-size=5G
          ccache -z
          make -j"$(nproc)" CROSS_COMPILE="ccache $CROSS_COMPILE" zImage
          make -j"$(nproc)" CROSS_COMPILE="ccache $CROSS_COMPILE" dtbs
          make -j"$(nproc)" CROSS_COMPILE="ccache $CROSS_COMPILE" modules
          ccache -s

      - name: 追加设备树并打包 uImage
        run: |
          set -euo pipefail
          cd linux_build
          ZIMG=arch/arm/boot/zImage
          DTB="arch/arm/boot/dts/hisilicon/$TARGET_DTB"
          if [ ! -f "$DTB" ]; then
            echo "::error::设备树不存在: $DTB"
            ls arch/arm/boot/dts/hisilicon/hi3798mv100*.dtb
            exit 1
          fi

          cat "$ZIMG" "$DTB" > zImage-dtb

          ZSIZE=$(stat -c%s "$ZIMG")
          DTB_SIZE=$(stat -c%s "$DTB")
          MAGIC=$(dd if=zImage-dtb bs=1 skip="$ZSIZE" count=4 2>/dev/null | od -A n -t x1 | tr -d ' \n\t')
          echo "zImage=$ZSIZE 字节, dtb=$DTB_SIZE 字节, 追加处魔数=$MAGIC"
          if [ "$MAGIC" != "d00dfeed" ]; then
            echo "::error::设备树追加位置错误，魔数不是 d00dfeed"
            exit 1
          fi

          mkimage -A arm -O linux -T kernel -C none \
            -a "$UIMAGE_LOADADDR" -e "$UIMAGE_LOADADDR" \
            -n "Linux-$PATCHES_KERNEL_VERSION-hi3798mv100" \
            -d zImage-dtb arch/arm/boot/uImage

          echo "=== uImage 头信息 ==="
          mkimage -l arch/arm/boot/uImage
          echo "uImage 总大小: $(stat -c%s arch/arm/boot/uImage) 字节（实机可启动镜像约 7328134 字节）"

      - name: 整理产物
        run: |
          set -euo pipefail
          cd linux_build
          rm -rf out
          mkdir -p out
          KREL="$(make -s kernelrelease)"
          cp arch/arm/boot/uImage out/uImage
          cp arch/arm/boot/zImage out/zImage
          cp arch/arm/boot/dts/hisilicon/*.dtb out/
          cp .config "out/config-$KREL"
          make INSTALL_MOD_PATH="$PWD/out/_mod" modules_install
          rm -f out/_mod/lib/modules/*/build out/_mod/lib/modules/*/source
          tar -czf out/modules.tar.gz -C out/_mod .
          rm -rf out/_mod
          echo "内核 release: $KREL"
          echo "=== 产物列表 ==="
          ls -lh out/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: hi3798mv100-linux-${{ env.PATCHES_KERNEL_VERSION }}
          if-no-files-found: error
          retention-days: 90
          path: linux_build/out/*
